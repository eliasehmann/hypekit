name: Feature request
description: An idea for the library, the CLI or the app
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do?
      description: The goal first (what you want to look at, export or build), then the feature you have in mind.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [App, CLI, Python API, HTTP API, Decoders, Other]
