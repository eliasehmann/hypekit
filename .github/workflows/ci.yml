name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q hypekit tests tools
      - name: Tests (install-based tests are skipped without a game)
        run: python -m unittest discover -s tests -v
      - name: Install the package
        run: python -m pip install .
      - name: Installed package works and ships the web UI
        working-directory: ${{ runner.temp }}
        run: |
          hypekit schema sound
          python -c "import hypekit, os; w = os.path.join(os.path.dirname(hypekit.__file__), 'web'); assert os.path.isfile(os.path.join(w, 'vendor', 'three', 'three.module.min.js')) and os.path.isfile(os.path.join(w, 'fonts', 'inter-var.woff2')), w; print(hypekit.__version__, 'ok')"
